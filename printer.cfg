[include mainsail.cfg]
[include timelapse.cfg]
[include resonance.cfg]

# Hoverfly - Ender 3 Pro, SKR Mini E3 V2.0, dual Z (series-wired, single driver),
# Sprite Extruder Pro (direct drive), CRTouch probe.
# See README.md in this repo for hardware history / Marlin fallback config.

[mcu]
# Fill in once printer is connected via USB (Step 4):
# ls /dev/serial/by-id/*  ->  paste the result below
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_30FFDC054754343035551557-if00

[printer]
kinematics: cartesian
max_velocity: 300           # Maximum velocity (in mm/s) of the toolhead (relative to the print). This value may be changed at runtime using the SET_VELOCITY_LIMIT command.
max_accel: 6000             # 400 might be a conservative value, but it works!
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_min: 0
position_max: 235
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_min: 0
position_max: 235
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
# -4 gives enough downward travel for PROBE_CALIBRATE (CRTouch triggers
# above the nozzle, so calibration needs to jog into negative Z).
position_min: -4
position_max: 240

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD2
microsteps: 16
full_steps_per_rotation: 200
max_extrude_only_distance: 100.0
#max_extrude_cross_section: 5 # for KAMP
rotation_distance: 7.501
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
#control: pid
min_temp: 0
# Sprite Extruder Pro rated 300C; 290 keeps margin
max_temp: 290

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC3
#control: pid
min_temp: 0
max_temp: 130

[bltouch]
sensor_pin: ^PC14
control_pin: PA1

# updated offsets 2026-08-08 after replacing mount
x_offset: -30.7
y_offset: -39.6
# set z-offset using PROBE_CALIBRATE
#z_offset: 0.0
samples: 2
speed: 3
sample_retract_dist: 3.0

[safe_z_home]
# center of bed (probe at 100, 100)
home_xy_position: 130.7, 139.6
speed: 50
z_hop: 10
z_hop_speed: 5

[bed_screws]
# Updated screw positions on 2026-08-08. Can't realistically 
# use SCREW_TILT_CALCULATE due to probe offset and size of bed.
screw1: 56.5, 81.7
screw1_name: front left
screw2: 196.3, 81.7
screw2_name: front right
screw3: 196.3, 211.7
screw3_name: back right
screw4: 30.5, 211.7
screw4_name: back left
horizontal_move_z: 10
speed: 100

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 190, 190
probe_count: 8,8
algorithm: bicubic # Trying per Ellis's guide

[heater_fan heatbreak_cooling_fan]
pin: PC7
heater: extruder
heater_temp: 50.0

[fan]
pin: PC6

[firmware_retraction]
retract_length: 0.5
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 40

[static_digital_output usb_pullup_enable]
pins: !PA14

[board_pins]
aliases:
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8,  EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB15, EXP1_10=<5V>
# EXP1_3 = TX1
# EXP1_4 = RST
# EXP1_5 = RX1

[input_shaper]
shaper_freq_x: 105
shaper_freq_y: 45
shaper_freq_z: 0
# default of 0 disables shaper

#shaper_type: 3hump_ei
#   A type of the input shaper to use for all axes. Supported
#   shapers are zv, mzv, zvd, ei, 2hump_ei, and 3hump_ei. Some shapers
#   support optional additional parameters, e.g. mzv(n=4,t=0.9) or
#   ei(v_tol=0.1). The default is mzv input shaper (without parameters).
shaper_type_x: 3hump_ei
shaper_type_y: ei
#shaper_type_z:
damping_ratio_x: 0.068
damping_ratio_y: 0.050
damping_ratio_z: 0.1
#               per ShakeTune   90% value
# max_accel_x:  7500            6750
# max_accel_y:  3030            2727

[temperature_sensor host]
sensor_type: temperature_host
sensor_path: /sys/class/thermal/thermal_zone0/temp

######################################################################
# 128x64 Full Graphic Creality CR10 / ENDER 3 stockdisplay
######################################################################
#
# The Creality "12864" stock display uses a single ribbon cable to
# connect from the display's EXP3 plug and the mcu board's EXP1
# connector. This isn't really explained well in example Klipper
# configs and is more complicated because instead of the stock Creality
# 4.2.2 board I'm using the SKR-mini-e3 v2.0 board.
#
# The EXP1 -> EXP3 display connector looks like this:
#
#                 ┌───────────┬───────────┐
# Creality 4.2.2  │ EXP1_1      │ EXP1_2      │   SKR-mini-e3 v2
#            PC6  │ beeper      │ click       │   
#                 ├───────────┼───────────┤
#                 │ EXP1_3      │ EXP1_4      │
#            PB10 │ encoder     │ <unused>    │
#                 ├───────────┼───────────┤
#                 │ EXP1_5      │ EXP1_6      │
#            PB14 │ encoder     │ clock       │
#                 │             │ sclk_pin    │
#                 ├───────────┼───────────┤
#                 │ EXP1_7      │ EXP1_8      │
#            PB12 │ chip select │ data        │
#                 │ (cs_pin)    │ (sid_p      │
#                 ├───────────┼───────────┤
#                 │ EXP1_9      │ EXP1_10     │
#                 │ <GND>       │ VCC_5V      │
#                 └───────────┴───────────┘
#
# The pins used for the two different board╷ are:
# ┏━━━━━━━━┳━━━━━━━━━━━━━┳━━━━━━━━━━━━━━┓
# ┃ EXP pin  │Creality 4.2.2 │ SKR-mini-e3 v2  │
# ┠────────┴─────────────┴──────────────┘
# ┃ EXP1_1   │     PC6       │      PB5        │
# ┃ EXP1_2   │     PB10      │      PA15       │
# ┃ EXP1_3   │     PB10      │      PA9        │
# ┃ EXP1_5   │     PB14      │      PA10       │
# ┃ EXP1_6   │     ?         │      PB9        │
# ┃ EXP1_7   │      PB12     │      PB8        │
# ┃ EXP1_8   │     ?         │      PB15       │
# ┃ EXP1_9   │     <GND>     │      <GND>      │
# ┃ EXP1_10╻ │     VCC_5V    │      VCC_5╻╻    │
# ┗━━━━━━━━┻━━━━━━━━━━━━━┻━━━━━━━━━━━━━━┛
# FOR SKR MINI E3 V2
# lcd_type: st7920
# cs_pin: EXP1_4
# sclk_pin: EXP1_5
# sid_pin: EXP1_3
# encoder_pins: ^EXP2_3, ^EXP2_5
# click_pin: ^!EXP1_2

[display]
lcd_type: st7920
cs_pin: PB8
sclk_pin: PB9
sid_pin: PB15
encoder_pins: ^PA10, ^PA9
click_pin: ^!PA15

[pwm_cycle_time BEEPER_pin]
pin: EXP1_1          # Beeper pin (defined in board_pins aliases)
value: 0             # Silent at power on, set to 1 if active low.
shutdown_value: 0    # Disable at emergency shutdown (no PWM would be available anyway).
cycle_time: 0.001    # Default PWM frequency : 0.001 = 1ms will give a tone of 1kHz



[idle_timeout]
;gcode:
; A list of G-Code commands to execute on an idle timeout. See docs/Command_Templates.md for G-Code format. The default is to run "TURN_OFF_HEATERS" and "M84".
timeout: 1800 ; Idle time (in seconds) to wait before running the above G-Code commands. The default is 600 seconds.


# Cancel object (aka Marlin/RRF M486 commands) support
#
# Enable object exclusion
[exclude_object]



[include moonraker_obico_macros.cfg]

[gcode_macro _CLIENT_VARIABLE]
#variable_use_custom_pos   : False ; use custom park coordinates for x,y [True/False]
#variable_custom_park_x    : 0.0   ; custom x position; value must be within your defined min and max of X
#variable_custom_park_y    : 0.0   ; custom y position; value must be within your defined min and max of Y
#variable_custom_park_dz   : 2.0   ; custom dz value; the value in mm to lift the nozzle when move to park position
#variable_retract          : 1.0   ; the value to retract while PAUSE
#variable_cancel_retract   : 5.0   ; the value to retract while CANCEL_PRINT
# variable_speed_retract    : 35.0  ; retract speed in mm/s
# variable_unretract        : 1.0   ; the value to unretract while RESUME
# variable_speed_unretract  : 35.0  ; unretract speed in mm/s
#variable_speed_hop        : 15.0  ; z move speed in mm/s
#variable_speed_move       : 100.0 ; move speed in mm/s
#variable_park_at_cancel   : False ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
#variable_park_at_cancel_x : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
#variable_park_at_cancel_y : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
# !!! Caution [firmware_retraction] must be defined in the printer.cfg if you set use_fw_retract: True !!!
variable_use_fw_retract   : True ; use fw_retraction instead of the manual version [True/False]
variable_idle_timeout     : 1800     ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
#variable_runout_sensor    : ""    ; If a sensor is defined, it will be used to cancel the execution of RESUME in case no filament is detected.
#                                   Specify the config name of the runout sensor e.g "filament_switch_sensor runout". Hint use the same as in your printer.cfg
# !!! Custom macros, please use with care and review the section of the corresponding macro.
# These macros are for simple operations like setting a status LED. Please make sure your macro does not interfere with the basic macro functions.
# Only  single line commands are supported, please create a macro if you need more than one command.
